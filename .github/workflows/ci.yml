name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show Spring Boot autoconfigure version (diagnostic)
        run: mvn -B -pl cab-app dependency:tree -Dverbose -Dincludes=org.springframework.boot:spring-boot-autoconfigure

      - name: Build and test
        run: mvn -B verify