# CI = Continuous Integration. On every push GitHub (free) builds the project and runs ALL tests, including the
# Testcontainers integration test (the runner has Docker). A green tick on the repo shows the code builds and passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
jobs:
  name: Show Spring Boot autoconfigure version (diagnostic)
  run: mvn -B -pl cab-app dependency:tree -Dincludes=org.springframework.boot:spring-boot-autoconfigure

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B verify
