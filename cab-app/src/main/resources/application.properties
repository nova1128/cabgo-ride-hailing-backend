spring.application.name=cab-app

# Cloud hosts (Render, etc.) tell the app which port to use through the PORT environment variable.
server.port=${PORT:8080}

# Loads application-local.properties (your private Neon credentials, git-ignored).
# Inside Docker this is overridden by the SPRING_PROFILES_ACTIVE environment variable.
spring.profiles.active=local

# ---------------------------------------------------------------- Database (PostgreSQL on Neon)
# URL / username / password come from application-local.properties (see application-local.properties.example)
# "update" lets Hibernate create/alter tables from the entities. Fine for learning; real projects use Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=10
# Neon closes idle connections after a few minutes, so recycle ours before that happens.
spring.datasource.hikari.max-lifetime=240000

# ---------------------------------------------------------------- Redis (driver geo-index, surge pricing)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Short timeouts so a dead Redis fails FAST and the circuit breaker can react (default is 60 seconds).
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# ---------------------------------------------------------------- Kafka (trip events)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
# If Kafka is down we give up quickly instead of blocking the rider's request for a minute.
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=4000
spring.kafka.admin.operation-timeout=5s

# ---------------------------------------------------------------- App settings
# Publish trip events to Kafka? Set CAB_EVENTS_ENABLED=false to run without Kafka (used in the free cloud deployment).
cab.events.enabled=${CAB_EVENTS_ENABLED:true}
# Where the browser finds the notification service (only used when events are enabled).
cab.notification-url=${NOTIFICATION_URL:http://localhost:8081}
# Driver matching strategy: "redis" (fast geo-index, default) or "sql" (full scan; used to benchmark).
cab.matching.strategy=${CAB_MATCHING_STRATEGY:redis}
# JWT signing key. DEV ONLY default. Set the JWT_SECRET environment variable for anything real (min 32 chars).
cab.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-32bytes-min!!}

# ---------------------------------------------------------------- Monitoring (Actuator + Prometheus)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Adds /actuator/health/liveness: reports UP whenever the app itself is alive, even if Redis is down.
# Cloud platforms use it as the health check so a Redis outage does not cause restart loops.
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=cab-app
# Needed for latency percentiles (p95/p99) in Grafana.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ---------------------------------------------------------------- Resilience4j
# CIRCUIT BREAKER around the Redis geo lookup (see DriverMatchingService).
# Looks at the last 10 calls; once at least 5 happened and >=50% failed, it OPENS for 10 seconds
# (calls go straight to the SQL fallback), then lets 3 trial calls through to test recovery.
resilience4j.circuitbreaker.instances.redisGeo.sliding-window-size=10
resilience4j.circuitbreaker.instances.redisGeo.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.redisGeo.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redisGeo.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.redisGeo.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.redisGeo.register-health-indicator=false

# RATE LIMITERS (per user, see RateLimitService). timeout-duration=0 means "reject immediately, do not wait".
resilience4j.ratelimiter.configs.login.limit-for-period=5
resilience4j.ratelimiter.configs.login.limit-refresh-period=60s
resilience4j.ratelimiter.configs.login.timeout-duration=0
resilience4j.ratelimiter.configs.trip.limit-for-period=30
resilience4j.ratelimiter.configs.trip.limit-refresh-period=60s
resilience4j.ratelimiter.configs.trip.timeout-duration=0

spring.datasource.url=jdbc:postgresql://YOUR-HOST.neon.tech/neondb?sslmode=require
spring.datasource.username=YOUR_USER
spring.datasource.password=YOUR_PASSWORD

