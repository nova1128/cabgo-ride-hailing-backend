spring.application.name=notification-service
server.port=${PORT:8081}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
# Services with the same group-id share the work; a different group-id would receive its own copy of every event.
spring.kafka.consumer.group-id=notification-service
# Only react to events that happen while this service is running.
spring.kafka.consumer.auto-offset-reset=latest
